pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

// Lets Gradle download a JDK 25 toolchain when the JVM running the build is older.
plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "jamepad"
